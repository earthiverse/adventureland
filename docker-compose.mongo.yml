services:
  mongo:
    image: mongo:8
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    healthcheck:
      test: echo 'rs.status().ok' | mongosh localhost:27017/test --quiet
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 30s
      start_interval: 5s
    volumes:
      # Persist data when the container is recreated
      - "./services/mongo/data:/data/db"
      # Initialization scripts when the docker container is created
      - "./services/mongo/init:/docker-entrypoint-initdb.d"
    ports:
      - 27017:27017

  central-server:
    depends_on:
      mongo:
        condition: service_healthy

  game-server:
    depends_on:
      mongo:
        condition: service_healthy
