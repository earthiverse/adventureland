services:
  mailpit:
    image: axllent/mailpit:latest
    volumes:
      # Persist data when the container is recreated
      - "./services/mailpit/data:/data"
    environment:
      MP_MAX_MESSAGES: 100
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - 1025:1025
      - 8025:8025
